name: ci

on:
  push:
    branches: [main, portfolio-v2]
  pull_request:

jobs:
  web-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  streamlit-policy-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: demos/streamlit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demos/streamlit/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
